# -------------------------
# HTTP (80): serve ACME challenges first, redirect everything else to HTTPS
# -------------------------

# denver.zerovision.dev -> HTTPS
server {
    listen 80;
    server_name denver.zerovision.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www.denver.zerovision.dev -> HTTPS (or straight to canonical host on HTTPS)
server {
    listen 80;
    server_name www.denver.zerovision.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://denver.zerovision.dev$request_uri;
    }
}

# -------------------------
# HTTPS (443): redirect www -> non-www, serve app on non-www
# -------------------------

# www.denver.zerovision.dev -> denver.zerovision.dev
server {
    listen 443 ssl;
    server_name www.denver.zerovision.dev;

    ssl_certificate /etc/letsencrypt/live/denver.zerovision.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denver.zerovision.dev/privkey.pem;

    return 301 https://denver.zerovision.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name denver.zerovision.dev;

    ssl_certificate /etc/letsencrypt/live/denver.zerovision.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denver.zerovision.dev/privkey.pem;

    location /map {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/v2, /api/v3, ... -> new NestJS backend (root-level API)
    # /api/v1 lives under /map/api/v1 and is handled by the /map block above
    location ~ ^/api/v([2-9]|[1-9][0-9]+)/ {
        proxy_pass http://vz-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect to primary dashboard
    location = / {
      return 301 /public/dashboard/fb40bd65-9a10-4f89-b0dd-05e642be4acd;
    }

    location / {
        proxy_pass http://metabase:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
