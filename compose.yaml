services:
  postgres:
    image: postgis/postgis:17-3.4
    container_name: postgres17
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: primary
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf
    ports:
      - 5432:5432
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    restart: always

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DATABASE_PASSWORD}
      MB_DB_HOST: postgres17
    ports:
      - 3000:3000

  nginx:
    image: nginx:alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - metabase

  nextjs:
    image: ghcr.io/akosborn/vision-zero:latest
    ports:
      - "3001:3000" # Maps host port 3001 to container port 3000
    environment:
      - DB_HOST=postgres17
      - DB_PORT=5432
      - DB_USER=${DATABASE_USER}
      - DB_PASSWORD=${DATABASE_PASSWORD}
      - DB_NAME=primary
      - NEXT_PUBLIC_MAPBOX_PUBLIC_TOKEN=${NEXT_PUBLIC_MAPBOX_PUBLIC_TOKEN}
      - NEXT_PUBLIC_BASE_PATH=/map
      - NEXT_PUBLIC_DRAW_ROUTE_ENABLED=${NEXT_PUBLIC_DRAW_ROUTE_ENABLED:-true}
      - NEXT_PUBLIC_UPLOAD_ROUTE_ENABLED=${NEXT_PUBLIC_UPLOAD_ROUTE_ENABLED:-false}
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
